plugins { id 'numen-plugin' }

// 只接 NeoForge:KubeJS 1.21.1 只有 NeoForge 版,编译对着 NeoForge 那份。版本对准 Craftoria 跑的那一版(见 gradle.properties 的
// kubejs_neoforge_version),而不是全仓的 neoforge_version:脚本的用例装的是 Craftoria 那几份模组,有的(Integrated Dynamics 自带的兼容模组)要更新的 NeoForge。
neoForge { version = kubejs_neoforge_version }

repositories {
    // KubeJS 与它的 Rhino 各自只从作者的仓库取,仓库也截不走别的坐标
    exclusiveContent {
        forRepository { maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases' } }
        filter { includeGroup 'dev.latvian.mods' }
    }
    // 脚本(scripts/*.js)的用例要真的模组:AE2 与 GuideME、Titanium 从 Modrinth 取,版本对准 Craftoria
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Functional Storage 那一版只在 CurseForge 上
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

// KubeJS 是 LGPL-3.0:只在编译期引用它的插件接口,运行时由玩家装的那份提供,本模块不携带它一个字节。
def kubejs = ["dev.latvian.mods:kubejs-neoforge:${kubejs_version}",
              "dev.latvian.mods:rhino:${rhino_version}"]

dependencies {
    // 瘦 api jar 取 NeoForge 那份:本联动本来就只跑在 NeoForge 上
    compileOnly files(project(':numen-api:neoforge').tasks.named('apiJar'))
    kubejs.each { compileOnly it }
}

/*
 * KubeJS 在场时的 GameTest:用例在 src/gametest,单开一次跑批 `./gradlew :plugins:kubejs:runGameTestServer`。
 *
 * 不挂进 Numen 那一次(:numen:neoforge:runGameTestServer):KubeJS 带着 mixin 与脚本引擎,挂上去全部用例的环境都跟着变。
 * 这一次照成品拼:本体、这个联动(成品 jar 里它本来就平铺在本体里,并带着 kubejs.plugins.txt,KubeJS 据此发现它)、联动的用例同在 numen
 * 这一个模组里,KubeJS 由运行时类路径带进来,和玩家装它一样被当成模组加载。
 *
 * 用例要读的脚本在运行目录的 kubejs/server_scripts 里:用例自己写、自己改,再触发 KubeJS 的脚本重载;每次跑批前先清掉上次的。
 * 套件是 numen_kubejs(见 KubeJsGameTestSuite)。
 */
sourceSets {
    gametest {}
}

def numenNeoForge = project(':numen:neoforge')
def gameTestStructures = project(':numen:common').layout.buildDirectory.dir('gameteststructures')
def kubejsSuite = rootProject.ext.numenSuites[project.path].gametest

neoForge {
    addModdingDependenciesTo(sourceSets.gametest)
    mods {
        numen {
            sourceSet numenNeoForge.sourceSets.main
            sourceSet project(':numen:common').sourceSets.testFixtures
            // 寻路模块的类在成品里平铺在本体的 jar 里;这里不走 jar,同样声明
            sourceSet project(':numen:pathing').sourceSets.main
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
        // Numen API 的 GameTest 支持:套件机制与登记入口、模拟主人连接的加载器实现
        numen_api_gametest {
            sourceSet project(':numen-api:neoforge').sourceSets.gametest
            sourceSet project(':numen-api:common').sourceSets.testFixtures
        }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            ideName = "NeoForge GameTestServer (${project.path})"
            sourceSet = sourceSets.gametest
            gameDirectory = project.mkdir(project.file('runs/gametestserver'))
            systemProperties.put('numen.gametest.suites', providers.gradleProperty('gametest').orElse(kubejsSuite))
            systemProperty('neoforge.enabledGameTestNamespaces', 'numen_kubejs')
            systemProperty('numen.gametest.structures', gameTestStructures.get().asFile.absolutePath)
            // 用例装上服务器的那几份脚本,不另写一份
            systemProperty('numen.kubejs.scripts', project.file('scripts').absolutePath)
        }
    }
}

/*
 * Integrated Dynamics 的 jar 里带着它与 Refined Storage 联动的 GameTest 类(GameTestsAspectsRefinedStorage)。NeoForge 开测时把每个
 * @GameTestHolder 类都载入,不看命名空间开没开;没装 Refined Storage 就载不进来,整个测试服起不来。用例用一份去掉这一个类的拷贝,
 * 其余与 Craftoria 那份 jar 逐字节相同。
 */
configurations {
    integratedDynamicsJar { transitive = false }
}

def integratedDynamicsForGameTests = tasks.register('integratedDynamicsForGameTests', Zip) {
    from({ zipTree(configurations.integratedDynamicsJar.singleFile) }) {
        exclude 'org/cyclops/integrateddynamicscompat/modcompat/refinedstorage/gametest/**'
    }
    archiveFileName = 'integrateddynamics-for-gametests.jar'
    destinationDirectory = layout.buildDirectory.dir('gametest-mods')
}

dependencies {
    gametestCompileOnly files({ numenNeoForge.sourceSets.main.output })
    gametestCompileOnly project(':numen:common').sourceSets.testFixtures.output
    // 套件接口:本联动的用例经它报到(numen_kubejs)
    gametestCompileOnly project(':numen-api:common').sourceSets.testFixtures.output
    // 用例直接读联动里包内的类,不绕脚本
    gametestCompileOnly sourceSets.main.output
    // 整个 Numen API(不是瘦 api jar):用例拉起同伴、调工具,和 Numen 的用例一样;运行时它就是 numen_api 那个模组
    gametestImplementation project(':numen-api:neoforge')
    // KubeJS 本体与 Rhino 在运行时类路径上当模组加载;KubeJS 运行期的几个库(小型 web 服务、动图)已经嵌套在它的 jar 里
    kubejs.each { gametestImplementation(it) { transitive = false } }
    // AE2 与 GuideME 在运行时类路径上当模组加载,只给 AE2 脚本的用例
    ["maven.modrinth:ae2:${ae2_version}", "maven.modrinth:guideme:${guideme_version}"].each {
        gametestRuntimeOnly(it) { transitive = false }
    }
    // Functional Storage 与 Titanium 只给 Functional Storage 脚本的用例:用例要直接连控制器、上锁,编译期也要它们
    ["curse.maven:functional-storage-556861:${functionalstorage_curse_file}", "maven.modrinth:titanium:${titanium_version}"].each {
        gametestImplementation(it) { transitive = false }
    }
    // Integrated Dynamics 一家只给 Integrated Dynamics 脚本的用例:用例借 Integrated Crafting 自带的 GameTest 助手搭网络,编译期也要它们
    integratedDynamicsJar "curse.maven:integrated-dynamics-236307:${integrateddynamics_curse_file}"
    gametestImplementation files(integratedDynamicsForGameTests)
    ["curse.maven:cyclops-core-232758:${cyclopscore_curse_file}",
     "curse.maven:common-capabilities-247007:${commoncapabilities_curse_file}",
     "curse.maven:integrated-tunnels-251389:${integratedtunnels_curse_file}",
     "maven.modrinth:integrated-crafting:${integratedcrafting_version}"].each {
        gametestImplementation(it) { transitive = false }
    }
}

tasks.named('compileGametestJava') {
    dependsOn ':numen:neoforge:classes', ':numen:common:testFixturesClasses'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn ':numen:neoforge:classes', ':numen-api:neoforge:gametestClasses', ':numen:common:syncGameTestStructures',
            ':numen:common:testFixturesClasses', ':numen-api:common:testFixturesClasses'
    // 脚本存在运行目录的 kubejs/ 里、不跟着世界走:上一次跑批留下的脚本会让这一次从中间开始,用例要从自己放的那份开始
    doFirst {
        delete fileTree(dir: project.file('runs/gametestserver/kubejs/server_scripts'))
    }
    // 测试服的配置目录每次开服从空的开始(世界目录由 TerrainWorld 清):上一次跑批(包括失败的一次)改过的开关、签过的皮肤缓存、
    // 发过的令牌、存下的档案不带进这一次。Paper 的 GameTest 每次整个运行目录都是新的
    doFirst {
        delete project.file('runs/gametestserver/config')
    }
}
